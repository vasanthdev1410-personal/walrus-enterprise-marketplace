name: walrus-enterprise

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [walrus-network]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    <<: *service-defaults
    image: postgres:17.7-alpine
    container_name: walrus-postgres
    profiles: [local, full]
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-walrus}
      POSTGRES_USER: ${DATABASE_USER:-walrus}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in the selected env file}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:8.4.0-alpine
    container_name: walrus-redis
    profiles: [local, full]
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in the selected env file}',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, -a, '${REDIS_PASSWORD}', ping]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.8.1
    container_name: walrus-prometheus
    profiles: [local, full]
    extra_hosts: ['host.docker.internal:host-gateway']
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.path=/prometheus',
        '--web.enable-lifecycle',
      ]
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    <<: *service-defaults
    image: grafana/grafana:12.3.3
    container_name: walrus-grafana
    profiles: [local, full]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the selected env file}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    ports: ['127.0.0.1:3001:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  nginx-local:
    <<: *service-defaults
    image: nginx:1.28.1-alpine
    container_name: walrus-nginx
    profiles: [local]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      WEB_UPSTREAM: host.docker.internal:3000
      API_UPSTREAM: host.docker.internal:4000
    ports: ['127.0.0.1:8080:80']
    volumes: [./infrastructure/nginx/templates:/etc/nginx/templates:ro]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: walrus-api
    profiles: [full]
    env_file: [.env.local]
    environment:
      DATABASE_HOST: postgres
      DATABASE_URL: postgresql://${DATABASE_USER:-walrus}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-walrus}?schema=public
      REDIS_HOST: redis
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:4000/health/ready]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: walrus-web
    profiles: [full]
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:3000/health]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  nginx-full:
    <<: *service-defaults
    image: nginx:1.28.1-alpine
    container_name: walrus-nginx-full
    profiles: [full]
    environment:
      WEB_UPSTREAM: web:3000
      API_UPSTREAM: api:4000
    ports: ['127.0.0.1:8080:80']
    volumes: [./infrastructure/nginx/templates:/etc/nginx/templates:ro]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  walrus-network:
    name: walrus-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
