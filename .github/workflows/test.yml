name: Test
on:
  pull_request:
  push:
    branches: [main, develop]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.34.5, run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        env:
          DATABASE_PASSWORD: local-password
          DATABASE_URL: postgresql://walrus:local-password@localhost:5432/walrus
          REDIS_PASSWORD: local-password
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm --filter @walrus/web build
        env:
          NEXT_STANDALONE: 'true'
      - run: pnpm --filter @walrus/web test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/coverage/**'
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30
