name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: walrus
          POSTGRES_USER: walrus
          POSTGRES_PASSWORD: local-password
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U walrus -d walrus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.4.0-alpine
        command: ['redis-server', '--requirepass', 'local-password']
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli -a local-password ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '10.34.5'
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.6.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        env:
          DATABASE_PASSWORD: local-password
          DATABASE_URL: postgresql://walrus:local-password@localhost:5432/walrus
          REDIS_PASSWORD: local-password
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm --filter @walrus/web build
        env:
          NEXT_STANDALONE: 'true'
      - run: pnpm --filter @walrus/web test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/coverage/**'
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30
